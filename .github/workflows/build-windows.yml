
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r GamePilot_LiveVision_1_3_LiveGrid/requirements.txt
          pip install pyinstaller

      - name: Build GamePilot.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name GamePilot --paths GamePilot_LiveVision_1_3_LiveGrid GamePilot_LiveVision_1_3_LiveGrid/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GamePilot-Windows
          path: dist/GamePilot.exe
